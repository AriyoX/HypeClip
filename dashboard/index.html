<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f3f3eb" />
    <title>HypeClip Studio</title>
    <link
      rel="preload"
      href="/fonts/barlow-condensed-700.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <header class="masthead">
      <div class="header-inner">
        <a class="brand" href="#overview" aria-label="HypeClip Studio home"
          ><span class="mark" aria-hidden="true"></span>HypeClip</a
        >
        <nav aria-label="Main navigation"></nav>
        <span class="local"><span aria-hidden="true"></span>Local studio</span>
      </div>
    </header>
    <main id="main" tabindex="-1"></main>
    <div id="notice" role="status"></div>
    <dialog id="help" aria-labelledby="help-title" aria-describedby="help-copy">
      <form method="dialog">
        <h2 id="help-title"></h2>
        <p id="help-copy"></p>
        <button>Close</button>
      </form>
    </dialog>
  </body>
</html>
